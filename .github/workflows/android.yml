name: Android preview
on:
  push:
    branches: [main, feature/dashboard-polish]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain the development signing certificate between previews
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openlauncher-development-signing-v2
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: openlauncher-preview
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openlauncher-preview
      - name: Publish installable development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mv app-debug.apk openlauncher-preview.apk
          sha256sum openlauncher-preview.apk > SHA256SUMS.txt
          gh release create "preview-${COMMIT_SHA:0:7}" openlauncher-preview.apk SHA256SUMS.txt \
            --target "$COMMIT_SHA" --prerelease --title "Open Launcher 0.0.6 development preview" \
            --notes "Installable debug-signed preview with a separate app ID, so it can coexist with your current launcher. Build and unit tests passed; physical head-unit testing is still required. Development signing is cached between builds; if the cache is lost, a future preview may require uninstalling the previous preview. Back up your settings first. Download the APK below, not the source archives."
