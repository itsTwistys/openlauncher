name: Android preview
on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain the development signing certificate between previews
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openlauncher-development-signing-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check map recovery and resizing with simulated tiles
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-map.cjs
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: openlauncher-preview
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
            app/build/outputs/ui-checks
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openlauncher-preview
      - name: Publish installable development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION" || { echo 'Missing versionName'; exit 1; }
          TAG="preview-${COMMIT_SHA:0:7}"
          mv app-debug.apk openlauncher-preview.apk
          sha256sum openlauncher-preview.apk > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          Open Launcher $VERSION is an installable, debug-signed development preview with a separate app ID. Build and unit tests passed. The preview has not been confirmed on all physical head units. See the [installation guide](https://github.com/$GH_REPO/blob/$TAG/docs/PREVIEW.md) for setup, features and known limits.

          Download the APK below, not the source archives. A checksum is provided in SHA256SUMS.txt. Development signing is cached between builds; if that cache is lost, back up settings before reinstalling the preview.
          EOF
          gh release create "$TAG" openlauncher-preview.apk SHA256SUMS.txt \
            --target "$COMMIT_SHA" --prerelease --title "Open Launcher $VERSION development preview" \
            --notes-file RELEASE_NOTES.md
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "PREVIEW_TAG=$TAG" >> "$GITHUB_ENV"
            echo "PREVIEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Update main README with the tested APK
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/README.md" --jq '.content' | base64 -d > README.current.md
          README_SHA=$(gh api "repos/$GH_REPO/contents/README.md" --jq '.sha')
          python3 - <<'PYDOC'
          import os
          from pathlib import Path
          path = Path('README.current.md')
          text = path.read_text()
          start, end = '<!-- preview-download:start -->', '<!-- preview-download:end -->'
          assert text.count(start) == text.count(end) == 1, 'Preview download markers missing'
          tag, version, repo = (os.environ[key] for key in ('PREVIEW_TAG', 'PREVIEW_VERSION', 'GH_REPO'))
          base = f'https://github.com/{repo}'
          block = f'''{start}
          **[Download Open Launcher {version} preview APK]({base}/releases/download/{tag}/openlauncher-preview.apk)**

          [Release notes and checksum]({base}/releases/tag/{tag}) · [Installation and testing guide]({base}/blob/{tag}/docs/PREVIEW.md)
          {end}'''
          path.write_text(text[:text.index(start)] + block + text[text.index(end) + len(end):])
          PYDOC
          README_CONTENT=$(base64 -w0 README.current.md)
          gh api -X PUT "repos/$GH_REPO/contents/README.md" \
            -f message="Update preview download for $PREVIEW_VERSION" \
            -f branch=main -f sha="$README_SHA" -f content="$README_CONTENT"
