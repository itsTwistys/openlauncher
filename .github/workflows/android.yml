name: Android preview
on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      preview_signing_available: ${{ steps.preview-signing.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore original preview signing key
        id: preview-signing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.OPENLAUNCHER_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo '::warning::Original preview signing key is unavailable. Build and tests will continue, but publication is blocked to protect in-place updates.'
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openlauncher-preview.keystore"
          test -s "$RUNNER_TEMP/openlauncher-preview.keystore"
          echo "OPENLAUNCHER_PREVIEW_KEYSTORE_PATH=$RUNNER_TEMP/openlauncher-preview.keystore" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check map recovery and resizing with simulated tiles
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-map.cjs
      - run: python3 scripts/test-apk-upgrade.py
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --continue --no-daemon
      - name: Verify APK updates the existing preview in place
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.preview-signing.outputs.available == 'true'
        id: upgrade-check
        run: python3 scripts/check-apk-upgrade.py scripts/preview-baseline.json app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.upgrade-check.outcome == 'success'
        with:
          name: openlauncher-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Report APK readiness
        if: always()
        env:
          SIGNING_AVAILABLE: ${{ steps.preview-signing.outputs.available }}
          UPGRADE_CHECK: ${{ steps.upgrade-check.outcome }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo '## APK readiness'
            echo "Build/check status: $BUILD_STATUS."
            if [ "$UPGRADE_CHECK" = success ]; then
              echo 'APK matches the pinned preview identity and has a higher version code. Publication can proceed if all build steps succeeded.'
            elif [ "$SIGNING_AVAILABLE" != true ]; then
              echo 'No installable update was uploaded: the original preview signing key is unavailable (or this is a validation-only run outside main).'
              echo 'Restore OPENLAUNCHER_PREVIEW_KEYSTORE_BASE64 with the original key, then run Android preview manually on main. A passing validation build alone is not a release.'
            else
              echo 'No installable update was uploaded: build or APK upgrade verification did not succeed. Review the failed step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openlauncher-preview.keystore"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
            app/build/outputs/ui-checks
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.preview_signing_available == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openlauncher-preview
      - name: Publish installable development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION" || { echo 'Missing versionName'; exit 1; }
          TAG="preview-${COMMIT_SHA:0:7}"
          mv app-debug.apk openlauncher-preview.apk
          sha256sum openlauncher-preview.apk > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          Open Launcher $VERSION is an installable, debug-signed development preview with a separate app ID. Build and unit tests passed. The preview has not been confirmed on all physical head units. See the [installation guide](https://github.com/$GH_REPO/blob/$TAG/docs/PREVIEW.md) for setup, features and known limits.

          Download the APK below, not the source archives. A checksum is provided in SHA256SUMS.txt. Install this APK over the existing Open Launcher Preview to keep your setup. Do not uninstall or clear storage. Publication verifies the pinned preview-25a391c signing certificate and application ID, and a higher version code. An installation from another signing key cannot be updated by this APK. A missing signing key blocks publication.
          EOF
          gh release create "$TAG" openlauncher-preview.apk SHA256SUMS.txt \
            --target "$COMMIT_SHA" --prerelease --title "Open Launcher $VERSION development preview" \
            --notes-file RELEASE_NOTES.md
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "PREVIEW_TAG=$TAG" >> "$GITHUB_ENV"
            echo "PREVIEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Update main README with the tested APK
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/README.md" --jq '.content' | base64 -d > README.current.md
          README_SHA=$(gh api "repos/$GH_REPO/contents/README.md" --jq '.sha')
          python3 - <<'PYDOC'
          import os
          from pathlib import Path
          path = Path('README.current.md')
          text = path.read_text()
          start, end = '<!-- preview-download:start -->', '<!-- preview-download:end -->'
          assert text.count(start) == text.count(end) == 1, 'Preview download markers missing'
          tag, version, repo = (os.environ[key] for key in ('PREVIEW_TAG', 'PREVIEW_VERSION', 'GH_REPO'))
          base = f'https://github.com/{repo}'
          block = f'''{start}
          **[Download Open Launcher {version} preview APK]({base}/releases/download/{tag}/openlauncher-preview.apk)**

          [Release notes and checksum]({base}/releases/tag/{tag}) · [Installation and testing guide]({base}/blob/{tag}/docs/PREVIEW.md)
          {end}'''
          path.write_text(text[:text.index(start)] + block + text[text.index(end) + len(end):])
          PYDOC
          README_CONTENT=$(base64 -w0 README.current.md)
          gh api -X PUT "repos/$GH_REPO/contents/README.md" \
            -f message="Update preview download for $PREVIEW_VERSION" \
            -f branch=main -f sha="$README_SHA" -f content="$README_CONTENT"
